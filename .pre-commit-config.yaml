# Pre-commit hooks for lorenzos-claude-code
# Install: pip install pre-commit && pre-commit install

repos:
  # JSON validation
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-json
        files: \.(json)$
        # .vscode/ holds JSONC (with comments) which is not parseable as JSON
        exclude: ^\.vscode/
      # pretty-format-json removed: its files: regex matched only
      # marketplace.json, and marketplace.json is now owned by sync-manifest
      # (same reasoning that already excluded plugin.json here: "plugin.json
      # is owned by sync-manifest which writes its own deterministic key
      # order" — marketplace.json now has that same owner). With no other
      # target left, re-scoping would exclude everything, so the hook is
      # removed outright rather than kept pointed at nothing. This is not a
      # loss of coverage: check-json above still validates JSON syntax, and
      # formatting is guaranteed by the deterministic generator plus the
      # sync-manifest-check drift gate below.
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-merge-conflict
      - id: check-yaml

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.38.0
    hooks:
      - id: markdownlint
        args: [--fix]
        exclude: ^node_modules/

  # Custom plugin validation
  - repo: local
    hooks:
      - id: validate-plugin-paths
        name: Validate plugin.json paths
        # plugin.json's arrays are bare path strings (not {path: ...}
        # objects) since the schema-string-emitting fix — Claude Code only
        # honours directory-path entries, so only `skills` is emitted here
        # at all (commands/agents are convention-discovered and
        # intentionally absent from plugin.json; see scripts/lib/manifest.js).
        entry: >-
          node -e "const p=JSON.parse(require('fs').readFileSync('.claude-plugin/plugin.json','utf8'));const fs=require('fs');let ok=true;for(const k of ['skills']){for(const x of (p[k]||[])){if(!fs.existsSync(x)){console.error('Missing:',x);ok=false;}}};process.exit(ok?0:1);"
        language: system
        files: ^\.claude-plugin/plugin\.json$
        pass_filenames: false
      - id: sync-manifest-check
        name: Verify manifest is in sync with disk
        entry: node scripts/sync-manifest.js --check
        language: system
        files: ^((commands|agents|skills|hooks)/.*|\.claude-plugin/plugin\.json|package\.json|README\.md|CLAUDE\.md)$
        pass_filenames: false
