permissions: read-all

# CI Pipeline for lorenzos-claude-code Plugin
# Validates plugin structure, runs tests, and publishes to npm

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [18, 20, 22]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Test CLI help
        run: node bin/cli.js help

      - name: Test CLI version
        run: node bin/cli.js version

  validate:
    name: Validate Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: "20"

      - name: Validate JSON files
        run: |
          echo "Validating JSON files..."
          # .vscode/ holds JSONC (with comments) which JSON.parse can't read
          for file in $(find . -name "*.json" -not -path "./node_modules/*" -not -path "./.vscode/*"); do
            echo "Checking $file"
            node -e "JSON.parse(require('fs').readFileSync('$file', 'utf8'))"
          done
          echo "All JSON files valid!"

      - name: Validate plugin structure
        run: |
          # Each check must FAIL the step when it fails. `test -d X && echo`
          # succeeds overall even when the test fails, which is how these
          # checks kept reporting green after the primitives moved to root.
          for f in .claude-plugin/plugin.json package.json CLAUDE.md bin/cli.js; do
            test -f "$f" || { echo "MISSING FILE: $f"; exit 1; }
            echo "ok: $f"
          done
          for d in commands agents skills hooks; do
            test -d "$d" || { echo "MISSING DIR: $d (plugin primitives live at the repo root)"; exit 1; }
            echo "ok: $d/"
          done
          echo "All required files present!"

      - name: Enforce flat commands and agents
        run: |
          # Claude Code auto-discovers commands and agents from the plugin root
          # and does NOT recurse. A file in a subdirectory is silently invisible
          # to every installed user while still being counted by the sync and
          # listed in the README, so this must fail the build.
          nested=$(find commands agents -mindepth 2 -name '*.md')
          if [ -n "$nested" ]; then
            echo "FAIL: these must be flat, not nested — auto-discovery will never find them:"
            echo "$nested"
            exit 1
          fi
          echo "commands/ and agents/ are flat"

      - name: Count components
        run: |
          echo ""
          echo "Plugin Component Summary"
          echo "========================"
          echo "Commands: $(find commands -name '*.md' | wc -l | tr -d ' ')"
          echo "Agents: $(find agents -name '*.md' | wc -l | tr -d ' ')"
          echo "Skills: $(find skills -name 'SKILL.md' | wc -l | tr -d ' ')"
          echo "Hooks: $(find hooks -name '*.js' | wc -l | tr -d ' ')"

      - name: Validate frontmatter
        run: |
          echo "Checking command frontmatter..."
          count=0
          for file in $(find commands -name '*.md'); do
            if head -1 "$file" | grep -q '^---$'; then
              echo "OK: $file"
              count=$((count + 1))
            else
              echo "FAIL: $file missing frontmatter"
              exit 1
            fi
          done
          # A vacuous pass is the failure mode this whole job exists to prevent.
          test "$count" -gt 0 || { echo "FAIL: no command files found at all"; exit 1; }
          echo "All $count commands have valid frontmatter!"

      - name: Check package.json validity
        run: npm pkg fix --dry-run

      - name: Verify manifest is in sync with disk
        run: node scripts/sync-manifest.js --check

  markdown-lint:
    name: Lint Markdown
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: "20"

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Lint documentation
        run: markdownlint README.md CLAUDE.md --disable MD013 MD033 MD041 || true

  publish:
    name: Publish to npm
    needs: [test, validate]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm install

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
